<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark Samuel — Electrical &amp; Computer Engineering</title>
    <meta
      name="description"
      content="Dean&#39;s List engineer at the University of Toronto, on AMD&#39;s PCIe IPE team. Looking for hardware, ASIC and silicon roles for Winter and Summer 2027."
    />

    <!-- Open Graph: controls the preview card when the link is pasted into
         Slack, LinkedIn or iMessage. Recruiters share links; make it look right. -->
    <meta property="og:title" content="Mark Samuel — Electrical &amp; Computer Engineering" />
    <meta
      property="og:description"
      content="UofT ECE 2T8. AMD PCIe IPE. Hardware, ASIC and silicon roles — Winter and Summer 2027."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
    />

    <!-- Runs before React mounts so the correct theme paints on first frame
         instead of flashing light then snapping to dark. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            stored || (prefersDark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
